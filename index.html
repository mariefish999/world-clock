  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles.css" />
    <title>World clock - Marie Fisher</title>
  </head>
  <body>
    <div class="container">
      <h1>World clock</h1>

      <select>
        <option value="">select a city</option>

      <div class="city">

      <div class="city">
        <h2>Sydney 🇦🇺</h2>
        <div class="date">August 27th 2026</div>

      </div>
      <footer>
        This project was coded by Marie Fisher and is
        <a href="https://github.com/mariefish999/world-clock" target="_blank"
