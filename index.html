<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.3/moment-timezone-with-data-1970-2030.min.js"></script>
    <link rel="stylesheet" href="src/styles.css" />
    <title>World clock - Marie Fisher</title>
  </head>
  <body>
    <div class="container">
      <h1>World clock</h1>

      <select>
        <option value="">select a city</option>
        <option value="">London</option>
        <option value="">Madrid</option>
        <option value="">Hong Kong</option>
      </select>

      <div class="city" id="los-angeles">
        <div>
          <h2>Los Angeles 🇺🇸</h2>
          <div class="date"></div>
        </div>
        <div class="time">18:45:15<small>PM</small></div>
      </div>

      <div class="city" id="sydney">
        <div>
          <h2>Sydney</h2>
          <div class="date"></div>
        </div>
        <div class="time">18:45:15<small>PM</small></div>
      </div>
    </div>
    <footer>
      This project was coded by <strong>Marie Fisher</strong> and is
      <a href="https://github.com/mariefish999/world-clock" target="_blank"
        >open sourced on Github</a
      >
    </footer>
    <script src="src/javascript.js"></script>
  </body>
</html>
